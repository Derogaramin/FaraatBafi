<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروفایل من | پنل بافنده</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/weaver.css">
</head>
<body class="weaver-panel">
  <div class="weaver-layout">
    <header class="weaver-header">
      <h2>پروفایل بافنده</h2>
    </header>

    <div class="weaver-content">
      <div class="card" style="text-align: center; margin-bottom: var(--space-lg);">
        <div class="profile-avatar" style="width: 80px; height: 80px; border-radius: 50%; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto var(--space-md);">ف م</div>
        <h2>فاطمه محمدی</h2>
        <p style="color: var(--color-text-secondary);">کد بافنده: WVR-045</p>
        <span class="badge badge--success">فعال</span>
      </div>

      <div class="card" style="margin-bottom: var(--space-lg);">
        <h3 style="margin-bottom: var(--space-md);">مهارت‌ها و تخصص</h3>
        <div style="display: flex; flex-wrap: wrap; gap: var(--space-sm);">
          <span class="badge badge--info">حوله‌بافی</span>
          <span class="badge badge--info">پارچه سنتی</span>
          <span class="badge badge--info">طرح‌های هندسی</span>
          <span class="badge badge--info">رنگرزی گیاهی</span>
        </div>
      </div>

      <div class="card" style="margin-bottom: var(--space-lg);">
        <h3 style="margin-bottom: var(--space-md);">اطلاعات تماس</h3>
        <p><i class="ti ti-phone"></i> ۰۹۱۲۵۵۶۳۲۱۴</p>
        <p><i class="ti ti-map-pin"></i> یزد، خیابان امام، کوچه بافندگان</p>
        <p><i class="ti ti-calendar"></i> عضویت از: فروردین ۱۴۰۱</p>
      </div>

      <button class="btn btn--secondary" style="width:100%;"><i class="ti ti-logout"></i> خروج</button>
    </div>

    <!-- نوار پایین -->
    <div class="weaver-bottom-nav">
      <a href="dashboard.html"><i class="ti ti-list-details"></i><span>سفارش‌ها</span></a>
      <a href="my-materials.html"><i class="ti ti-package"></i><span>مواد من</span></a>
      <a href="profile.html" class="active"><i class="ti ti-user"></i><span>پروفایل</span></a>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
</body>
</html>
