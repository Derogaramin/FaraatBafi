<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروش حضوری | پنل نمایندگی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/agency.css">
</head>
<body class="agency-layout">
  <header class="agency-header">
    <h2>نمایندگی مرکزی</h2>
    <span class="agency-balance">موجودی کیف: ۱۲,۴۰۰,۰۰۰ تومان</span>
  </header>

  <nav class="agency-nav">
    <a href="dashboard.html">داشبورد</a>
    <a href="pos-sale.html" class="active">فروش حضوری</a>
    <a href="consignment.html">کالاهای امانی</a>
    <a href="commission.html">پورسانت</a>
  </nav>

  <div class="agency-content">
    <div class="pos-layout">
      <!-- بخش محصولات -->
      <div>
        <div class="pos-search">
          <input class="input barcode-input" id="barcode-input" type="text" placeholder="اسکن بارکد یا جستجوی محصول..." autofocus>
        </div>
        <div class="pos-search" style="margin-bottom: var(--space-sm);">
          <input class="input" id="pos-search" type="text" placeholder="جستجوی نام محصول...">
        </div>
        <div class="pos-product-list" id="pos-product-list">
          <!-- توسط pos.js پر می‌شود -->
        </div>
      </div>

      <!-- سبد خرید -->
      <div class="pos-cart">
        <h3><i class="ti ti-shopping-cart"></i> سبد خرید (<span id="pos-item-count">۰</span>)</h3>
        <div id="pos-cart-items">
          <p style="text-align:center; color:var(--color-text-muted);">سبد خرید خالی است</p>
        </div>
        <div class="pos-total" id="pos-total">۰ تومان</div>

        <div class="customer-info">
          <input class="input" id="customer-name" type="text" placeholder="نام مشتری">
          <input class="input" id="customer-phone" type="tel" placeholder="شماره تماس *" required>
        </div>
        <button class="btn btn--accent" style="width:100%; margin-top: var(--space-md);" onclick="POS.checkout()">
          <i class="ti ti-check"></i> ثبت فروش نهایی
        </button>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/pos.js"></script>
</body>
</html>
