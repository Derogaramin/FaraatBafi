<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>پنل نمایندگی | فرت‌بافی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <header style="background: var(--color-surface); padding: var(--space-md); display: flex; justify-content: space-between; align-items: center;">
    <h2>نمایندگی مرکزی</h2>
    <span class="badge badge--success"><i class="ti ti-wallet"></i> موجودی شما: ۱۲,۴۰۰,۰۰۰ تومان</span>
  </header>
  <main class="container" style="margin-top: var(--space-xl);">
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-xl);">
      <!-- لیست کالاهای امانی -->
      <div class="card">
        <h3>کالاهای امانی</h3>
        <table style="margin-top: var(--space-md);">
          <thead><tr><th>کد</th><th>نام محصول</th><th>وضعیت</th><th>عملیات</th></tr></thead>
          <tbody>
            <tr><td>1023</td><td>حوله حمام</td><td><span class="badge badge--warning">فروش نرفته</span></td><td><button class="btn btn--sm btn--accent">ثبت فروش</button></td></tr>
            <tr><td>1045</td><td>پارچه سنتی</td><td><span class="badge badge--success">فروخته شده</span></td><td>-</td></tr>
          </tbody>
        </table>
        <button class="btn btn--secondary" style="margin-top: var(--space-md);"><i class="ti ti-barcode"></i> اسکن بارکد (POS)</button>
      </div>
      <!-- وضعیت پورسانت -->
      <div class="card">
        <h3>پورسانت این ماه</h3>
        <p style="font-size: 2rem; font-weight: bold; color: var(--color-primary); margin: var(--space-md) 0;">۲,۴۵۰,۰۰۰ <span style="font-size: 1rem;">تومان</span></p>
        <p>فروش کل: ۲۴ قلم</p>
        <progress value="70" max="100" style="width:100%; accent-color: var(--color-primary);"></progress>
        <small>۷۰٪ تا هدف ماهانه</small>
      </div>
    </div>
  </main>
</body>
</html>
