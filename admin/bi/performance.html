<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد هوش تجاری | فرت‌بافی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="admin-layout">
  <!--#include file="../shared/partials/admin-sidebar.html" -->
  <main class="admin-main">
    <header class="admin-header"><h1>داشبورد هوش تجاری</h1></header>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-icon"><i class="ti ti-chart-line"></i></div><div><div class="kpi-value">۱۵٪</div><div class="kpi-label">رشد فروش</div></div></div>
      <div class="kpi-card"><div class="kpi-icon"><i class="ti ti-star"></i></div><div><div class="kpi-value">حوله حمام</div><div class="kpi-label">پرفروش‌ترین</div></div></div>
    </div>
    <div class="card" style="margin-bottom: var(--space-lg);">
      <h3>روند فروش ماهانه</h3>
      <div style="height: 300px;"><canvas id="salesChartMonthly"></canvas></div>
    </div>
    <div class="card">
      <h3>پرفروش‌ترین محصولات</h3>
      <div style="height: 300px;"><canvas id="topProductsChart"></canvas></div>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/dashboard.js"></script>
</body>
</html>
