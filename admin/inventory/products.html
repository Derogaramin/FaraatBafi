<!DOCTYPE html>

<body class="admin-layout">

  <main class="admin-main">
    <header class="admin-header"><h1>موجودی محصولات نهایی</h1></header>
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead><tr><th>کد یکتا</th><th>نام محصول</th><th>بافنده</th><th>تاریخ تولید</th><th>کیفیت</th><th>وضعیت</th></tr></thead>
          <tbody>
            <tr><td><span class="badge badge--info">FB-1023</span></td><td>حوله حمام</td><td>فاطمه محمدی</td><td>۱۴۰۳/۰۲/۱۰</td><td><span class="badge badge--success">قبول</span></td><td>موجود در انبار</td></tr>
            <tr><td><span class="badge badge--info">FB-1045</span></td><td>پارچه سنتی</td><td>زهرا حسینی</td><td>۱۴۰۳/۰۲/۰۸</td><td><span class="badge badge--success">قبول</span></td><td>ارسال به نمایندگی</td></tr>
            <tr><td><span class="badge badge--info">FB-1060</span></td><td>حوله دستی</td><td>فاطمه محمدی</td><td>۱۴۰۳/۰۲/۱۲</td><td><span class="badge badge--warning">نیازمند اصلاح</span></td><td>در انتظار بازبافت</td></tr>
          </tbody>
        </table>
      </div>
      <div style="margin-top: var(--space-md);">
        <button class="btn"><i class="ti ti-qrcode"></i> چاپ QR کدهای انتخاب‌شده</button>
      </div>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
