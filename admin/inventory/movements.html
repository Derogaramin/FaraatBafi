<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گزارش گردش کالا | فرت‌بافی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-layout">
  <!--#include file="../shared/partials/admin-sidebar.html" -->
  <main class="admin-main">
    <header class="admin-header"><h1>گزارش گردش کالا</h1></header>
    <div class="filter-bar">
      <div class="filter-group"><label>نوع:</label><select class="select"><option>همه</option><option>ورود</option><option>خروج</option></select></div>
      <div class="filter-group"><label>از تاریخ:</label><input class="input" type="date"></div>
      <div class="filter-group"><label>تا:</label><input class="input" type="date"></div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>تاریخ</th><th>نوع</th><th>کالا</th><th>مقدار</th><th>مبدا/مقصد</th><th>کاربر ثبت‌کننده</th></tr></thead>
        <tbody>
          <tr><td>۱۴۰۳/۰۲/۱۲</td><td><span class="badge badge--warning">خروج</span></td><td>نخ نیلی</td><td>۳ بوبین</td><td>به بافنده فاطمه محمدی</td><td>مدیر</td></tr>
          <tr><td>۱۴۰۳/۰۲/۱۰</td><td><span class="badge badge--info">ورود</span></td><td>نخ پنبه‌ای</td><td>۲۰ بوبین</td><td>از تأمین‌کننده</td><td>مدیر</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
