<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کتابخانه طرح‌ها | فرت‌بافی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-layout">
  <!--#include file="../shared/partials/admin-sidebar.html" -->
  <main class="admin-main">
    <header class="admin-header">
      <h1>کتابخانه طرح‌ها و الگوهای بافت</h1>
      <button class="btn"><i class="ti ti-upload"></i> آپلود طرح جدید</button>
    </header>
    <div class="card">
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-md);">
        <div class="card" style="text-align: center;">
          <img src="../../assets/images/product-placeholder.png" style="width:100%; height: 150px; object-fit: cover; border-radius: var(--radius-sm);">
          <p>طرح چهارخانه</p>
          <button class="btn btn--sm btn--secondary">دانلود</button>
        </div>
        <div class="card" style="text-align: center;">
          <img src="../../assets/images/product-placeholder.png" style="width:100%; height: 150px; object-fit: cover; border-radius: var(--radius-sm);">
          <p>طرح جناغی</p>
          <button class="btn btn--sm btn--secondary">دانلود</button>
        </div>
      </div>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
