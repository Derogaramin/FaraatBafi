<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توزیع مواد اولیه | فرت‌بافی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-layout">
  <!--#include file="../shared/partials/admin-sidebar.html" -->
  <main class="admin-main">
    <header class="admin-header"><h1>توزیع مواد اولیه به بافندگان</h1></header>
    <div class="card">
      <form onsubmit="event.preventDefault(); showToast('مواد با موفقیت توزیع شد', 'success');">
        <div class="form-row">
          <div class="form-group"><label>بافنده</label><select class="select"><option>فاطمه محمدی</option><option>زهرا حسینی</option></select></div>
          <div class="form-group"><label>نوع نخ</label><select class="select"><option>پنبه‌ای - نیلی</option><option>پنبه‌ای - زرشکی</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>تعداد بوبین</label><input class="input" type="number" value="2" min="1" required></div>
          <div class="form-group"><label>تاریخ تحویل</label><input class="input" type="date" required></div>
        </div>
        <button type="submit" class="btn"><i class="ti ti-truck-delivery"></i> ثبت توزیع</button>
      </form>
    </div>
    <div class="card" style="margin-top: var(--space-lg);">
      <h3>سوابق توزیع</h3>
      <table>
        <thead><tr><th>بافنده</th><th>مواد</th><th>مقدار</th><th>تاریخ</th><th>وضعیت</th></tr></thead>
        <tbody>
          <tr><td>فاطمه محمدی</td><td>نخ نیلی</td><td>۳ بوبین</td><td>۱۴۰۳/۰۲/۱۰</td><td><span class="badge badge--success">تحویل شد</span></td></tr>
          <tr><td>زهرا حسینی</td><td>نخ زرشکی</td><td>۱ بوبین</td><td>۱۴۰۳/۰۲/۰۵</td><td><span class="badge badge--success">تحویل شد</span></td></tr>
        </tbody>
      </table>
    </div>
  </main>
  <div class="toast-container"></div>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
