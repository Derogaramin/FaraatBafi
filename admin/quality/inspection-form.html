<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت بازرسی کیفیت | فرت‌بافی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-layout">
  <!--#include file="../shared/partials/admin-sidebar.html" -->
  <main class="admin-main">
    <header class="admin-header"><h1>ثبت نتیجه بازرسی</h1></header>
    <div class="card">
      <form onsubmit="event.preventDefault(); showToast('نتیجه با موفقیت ثبت شد', 'success');">
        <div class="form-group"><label>کد محصول</label><input class="input" type="text" placeholder="مثلاً FB-1023" required></div>
        <div class="form-row">
          <div class="form-group"><label>تراکم بافت</label><select class="select"><option>مطلوب</option><option>متوسط</option><option>ضعیف</option></select></div>
          <div class="form-group"><label>یکنواختی رنگ</label><select class="select"><option>عالی</option><option>خوب</option><option>نیازمند بررسی</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>ابعاد</label><input class="input" type="text" placeholder="مثلاً ۵۰×۱۰۰"></div>
          <div class="form-group"><label>نتیجه نهایی</label><select class="select"><option>قبول</option><option>مردود</option><option>نیازمند اصلاح</option></select></div>
        </div>
        <div class="form-group"><label>توضیحات</label><textarea class="textarea" rows="3"></textarea></div>
        <button type="submit" class="btn"><i class="ti ti-check"></i> ثبت</button>
      </form>
    </div>
  </main>
  <div class="toast-container"></div>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
