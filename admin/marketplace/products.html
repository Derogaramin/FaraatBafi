<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت محصولات | فرت‌بافی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-layout">
  <!--#include file="../shared/partials/admin-sidebar.html" -->
  <main class="admin-main">
    <header class="admin-header">
      <h1>مدیریت محصولات</h1>
      <div style="display: flex; gap: var(--space-md);">
        <div class="search-box"><input class="input" type="text" placeholder="جستجوی محصول..."><i class="ti ti-search"></i></div>
        <a href="product-form.html" class="btn"><i class="ti ti-plus"></i> محصول جدید</a>
      </div>
    </header>

    <div class="card" style="padding: var(--space-lg);">
      <div class="table-wrapper">
        <table>
          <thead><tr><th>تصویر</th><th>نام محصول</th><th>قیمت</th><th>موجودی</th><th>دسته‌بندی</th><th>وضعیت</th><th>عملیات</th></tr></thead>
          <tbody>
            <tr>
              <td><img src="../../assets/images/product-placeholder.png" style="width:50px;height:50px;border-radius:var(--radius-sm);object-fit:cover;"></td>
              <td>حوله حمام دست‌باف</td>
              <td>۳۲۰,۰۰۰</td>
              <td><span class="badge badge--success">۳۲</span></td>
              <td>حوله</td>
              <td><span class="badge badge--success">فعال</span></td>
              <td>
                <a href="product-form.html" class="btn btn--sm btn--secondary"><i class="ti ti-edit"></i></a>
                <button class="btn btn--sm btn--secondary"><i class="ti ti-trash" style="color:var(--color-danger);"></i></button>
              </td>
            </tr>
            <tr>
              <td><img src="../../assets/images/product-placeholder.png" style="width:50px;height:50px;border-radius:var(--radius-sm);object-fit:cover;"></td>
              <td>پارچه سنتی طرح یزدی</td>
              <td>۴۵۰,۰۰۰</td>
              <td><span class="badge badge--warning">۸</span></td>
              <td>پارچه</td>
              <td><span class="badge badge--success">فعال</span></td>
              <td>
                <a href="product-form.html" class="btn btn--sm btn--secondary"><i class="ti ti-edit"></i></a>
                <button class="btn btn--sm btn--secondary"><i class="ti ti-trash" style="color:var(--color-danger);"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
