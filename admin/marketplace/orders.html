  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">

    <div class="card">
      <div class="table-wrapper">

          <thead><tr><th>شماره</th><th>مشتری</th><th>مبلغ</th><th>بافنده</th><th>تاریخ</th><th>وضعیت</th><th>عملیات</th></tr></thead>

          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
