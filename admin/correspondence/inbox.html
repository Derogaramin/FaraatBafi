<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صندوق پیام‌ها | فرت‌بافی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-layout">
  <!--#include file="../shared/partials/admin-sidebar.html" -->
  <main class="admin-main" style="display: flex; flex-direction: column;">
    <header class="admin-header" style="flex-shrink:0;">
      <h1>صندوق پیام‌ها</h1>
      <a href="compose.html" class="btn"><i class="ti ti-pencil"></i> پیام جدید</a>
    </header>
    <div style="display: flex; gap: var(--space-lg); flex: 1;">
      <!-- لیست پیام‌ها -->
      <div style="width: 300px; border-left: 1px solid var(--color-border); overflow-y: auto;">
        <div class="filter-bar" style="flex-direction: column; align-items: stretch;">
          <input class="input" type="text" placeholder="جستجو...">
        </div>
        <div style="padding: var(--space-sm);">
          <a href="message-detail.html" style="display: block; padding: var(--space-sm); border-radius: var(--radius-sm); background: var(--color-surface); margin-bottom: 4px; text-decoration: none; color: inherit;">
            <strong>حسن کریمی</strong>
            <p style="font-size:0.85rem; color:var(--color-text-muted);">موضوع: بررسی بودجه</p>
            <small style="color:var(--color-text-muted);">امروز ۱۰:۳۰</small>
          </a>
          <a href="message-detail.html" style="display: block; padding: var(--space-sm); border-radius: var(--radius-sm); margin-bottom: 4px; text-decoration: none; color: inherit;">
            <strong>زهرا رضایی</strong>
            <p style="font-size:0.85rem; color:var(--color-text-muted);">موضوع: سفارش‌های جدید</p>
            <small style="color:var(--color-text-muted);">دیروز</small>
          </a>
        </div>
      </div>
      <!-- محتوای پیام -->
      <div style="flex: 1; padding: var(--space-lg);">
        <p style="text-align: center; color: var(--color-text-muted);">یک مکالمه را انتخاب کنید</p>
      </div>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
