<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازیابی رمز عبور | فرت‌بافی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/public.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>🏺 فرت‌بافی</h1>
      <p>بازیابی رمز عبور</p>
    </div>

    <form onsubmit="event.preventDefault(); showToast('لینک بازیابی به ایمیل شما ارسال شد', 'success');">
      <p style="color: var(--color-text-muted); margin-bottom: var(--space-lg);">ایمیل یا شماره تماس خود را وارد کنید تا لینک بازیابی برای شما ارسال شود.</p>
      <div class="form-group">
        <label>ایمیل یا شماره تماس</label>
        <input class="input" type="text" placeholder="example@email.com" required>
      </div>
      <button type="submit" class="btn" style="width:100%;"><i class="ti ti-mail-forward"></i> ارسال لینک بازیابی</button>
    </form>

    <div class="auth-footer">
      <a href="login.html">بازگشت به صفحه ورود</a>
    </div>
  </div>
  <div class="toast-container"></div>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
