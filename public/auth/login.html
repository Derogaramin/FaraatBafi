<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | فرت‌بافی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/webfonts/Vazirmatn.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/public.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>🏺 فرت‌بافی</h1>
      <p>ورود به حساب کاربری</p>
    </div>

    <form onsubmit="event.preventDefault(); showToast('ورود موفقیت‌آمیز. در حال انتقال...', 'success'); setTimeout(()=>window.location='../marketplace/catalog.html', 1500);">
      <div class="form-group">
        <label>نام کاربری یا ایمیل</label>
        <input class="input" type="text" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label>رمز عبور</label>
        <input class="input" type="password" placeholder="********" required>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md);">
        <label style="display: flex; align-items: center; gap: var(--space-sm); cursor: pointer;">
          <input type="checkbox"> مرا به خاطر بسپار
        </label>
        <a href="forgot-password.html" style="font-size: 0.9rem;">رمز عبور را فراموش کرده‌اید؟</a>
      </div>
      <button type="submit" class="btn" style="width:100%;"><i class="ti ti-login"></i> ورود</button>
    </form>

    <div class="auth-footer">
      حساب کاربری ندارید؟ <a href="register.html">ثبت‌نام</a>
    </div>
  </div>
  <div class="toast-container"></div>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
