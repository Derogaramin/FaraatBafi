services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/faraatbafi/storage
      - uploads:/var/www/faraatbafi/public/assets/uploads
    environment:
      APP_ENV: production
      APP_DEBUG: "0"
      APP_URL: http://localhost:8081
      PUBLIC_URL: http://localhost:8081
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: faraatbafi
      DB_USER: faraat
      DB_PASS: ${DB_PASS:-faraat_secret}
    depends_on:
      db:
        condition: service_healthy

  # کارگر صف رویدادها (نقشهٔ راه ۰٫۳٫۱)
  queue:
    build: .
    restart: unless-stopped
    command: php bin/faraat queue:work
    volumes:
      - ./storage:/var/www/faraatbafi/storage
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_NAME: faraatbafi
      DB_USER: faraat
      DB_PASS: ${DB_PASS:-faraat_secret}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/faraatbafi:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/faraatbafi/public/assets/uploads:ro
    depends_on:
      - app

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secret}
      MYSQL_DATABASE: faraatbafi
      MYSQL_USER: faraat
      MYSQL_PASSWORD: ${DB_PASS:-faraat_secret}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  uploads:
